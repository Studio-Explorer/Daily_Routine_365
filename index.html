<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>365 Day Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>


<header class="hero">
  <svg class="stars" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
    <g fill="#fff">
      <circle cx="120" cy="40" r="1.4"/><circle cx="300" cy="80" r="1"/><circle cx="480" cy="30" r="1.6"/>
      <circle cx="660" cy="70" r="1.1"/><circle cx="840" cy="36" r="1.3"/><circle cx="1010" cy="86" r="1"/>
      <circle cx="210" cy="130" r="1"/><circle cx="560" cy="120" r="1.2"/><circle cx="930" cy="140" r="1.1"/>
    </g>
  </svg>
  <svg class="mtn" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 120 L150 48 L250 92 L380 26 L520 96 L660 44 L800 100 L940 52 L1080 98 L1200 60 L1200 120Z" fill="#0B1020"/>
  </svg>
  <div class="hero-inner">
    <div>
      <div class="eyebrow">Personal Growth OS</div>
      <h1><span>365 Day</span><span>Challenge</span></h1>
      <div class="tagline">Cybersecurity + cloud + discipline.</div>
      <div class="herobar"><i id="herobar"></i></div>
    </div>
    <div class="hand">“A better you<br>in 365 days.”<i></i></div>
  </div>
  <div class="pills">
    <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>Focus</div>
    <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 5h7a3 3 0 013 3v11a3 3 0 00-3-3H3z"/><path d="M21 5h-7a3 3 0 00-3 3v11a3 3 0 013-3h7z"/></svg>Learn</div>
    <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Build</div>
    <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 21c0-7 4-11 9-11 0 6-4 11-9 11z"/><path d="M12 21c0-5-3-8-7-8 0 4 3 8 7 8z"/></svg>Grow</div>
  </div>
</header>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <b>My Journey</b>
      <small>Better habits. Brighter future.</small>
    </div>
    <nav id="nav"></nav>
    <div class="sidequote">
      <p>Small steps every day lead to big results.</p><i></i>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div class="confetti" id="confetti"></div>


<script src="js/data/core.js"></script>
<script src="js/data/career.js"></script>
<script src="js/data/resources.js"></script>
<script src="js/script.js"></script>
</body>
</html>
